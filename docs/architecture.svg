<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="880" viewBox="0 0 1520 880" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1520" height="880" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#0f172a">memex — voice/text capture agent on Google Cloud</text>
  <text x="40" y="74" font-size="15" fill="#475569">everything scales to zero: Cloud Run min-instances = 0, pay-per-use Firestore / GCS / Gemini</text>

  <!-- ===================== Clients column ===================== -->
  <text x="40" y="128" font-size="14" font-weight="bold" fill="#64748b" letter-spacing="1">CAPTURE CLIENTS</text>
  <g>
    <rect x="40" y="140" width="240" height="74" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="58" y="168" font-size="15" font-weight="bold" fill="#1e3a8a">iOS Shortcut</text>
    <text x="58" y="190" font-size="13" fill="#334155">record → POST audio/mp4</text>
  </g>
  <g>
    <rect x="40" y="228" width="240" height="74" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="58" y="256" font-size="15" font-weight="bold" fill="#1e3a8a">Desktop hotkey</text>
    <text x="58" y="278" font-size="13" fill="#334155">ffmpeg wav → POST audio/wav</text>
  </g>
  <g>
    <rect x="40" y="316" width="240" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="58" y="344" font-size="15" font-weight="bold" fill="#1e3a8a">React SPA (web)</text>
    <text x="58" y="366" font-size="13" fill="#334155">text capture · feed · tasks</text>
    <text x="58" y="386" font-size="13" fill="#334155">approvals · routine runs</text>
  </g>
  <g>
    <rect x="40" y="430" width="240" height="58" rx="10" fill="#fefce8" stroke="#facc15" stroke-width="1.5"/>
    <text x="58" y="454" font-size="14" font-weight="bold" fill="#713f12">Secret Manager</text>
    <text x="58" y="474" font-size="13" fill="#334155">per-device bearer keys</text>
  </g>

  <!-- client arrows into Cloud Run -->
  <path d="M280,177 L392,177" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M280,265 L392,265" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M280,361 L392,361" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="290" y="160" font-size="12" fill="#64748b">Bearer key</text>

  <!-- ===================== Cloud Run ===================== -->
  <rect x="392" y="120" width="420" height="430" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="412" y="152" font-size="17" font-weight="bold" fill="#0f172a">Cloud Run · memex</text>
  <text x="412" y="172" font-size="13" fill="#475569">one container, min-instances = 0</text>

  <rect x="412" y="188" width="380" height="86" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="428" y="212" font-size="14" font-weight="bold" fill="#0f172a">FastAPI</text>
  <text x="428" y="232" font-size="13" fill="#334155">/api/v1: capture · notes · tasks · approvals · runs</text>
  <text x="428" y="252" font-size="13" fill="#334155">serves the built React SPA at /</text>

  <rect x="412" y="288" width="380" height="106" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="428" y="312" font-size="14" font-weight="bold" fill="#0f172a">Agent (Gemini tool loop)</text>
  <text x="428" y="332" font-size="13" fill="#334155">enrichment: audio/text → transcript, summary,</text>
  <text x="428" y="350" font-size="13" fill="#334155">tags, tasks, trace — one structured Gemini call</text>
  <text x="428" y="370" font-size="13" fill="#334155">routines: multi-step tool loop over notes/tasks</text>

  <rect x="412" y="408" width="380" height="120" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="428" y="432" font-size="14" font-weight="bold" fill="#7c2d12">/internal/* (no public access)</text>
  <text x="428" y="452" font-size="13" fill="#334155">OIDC token verify: audience set +</text>
  <text x="428" y="470" font-size="13" fill="#334155">invoker service-account allowlist</text>
  <text x="428" y="494" font-size="13" fill="#334155">/internal/enrich ← Eventarc</text>
  <text x="428" y="512" font-size="13" fill="#334155">/internal/routines/&lt;name&gt; ← Cloud Scheduler</text>

  <!-- ===================== Right column ===================== -->
  <text x="1000" y="128" font-size="14" font-weight="bold" fill="#64748b" letter-spacing="1">STATE &amp; MODEL</text>
  <g>
    <rect x="1000" y="140" width="300" height="128" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="1018" y="168" font-size="15" font-weight="bold" fill="#14532d">Firestore</text>
    <text x="1018" y="190" font-size="13" fill="#334155">notes · tasks · captures · approvals</text>
    <text x="1018" y="208" font-size="13" fill="#334155">routine runs (each with full trace)</text>
    <text x="1018" y="230" font-size="13" fill="#334155">ULID ids; 8 composite indexes for</text>
    <text x="1018" y="248" font-size="13" fill="#334155">filtered, ULID-ordered queries</text>
  </g>
  <g>
    <rect x="1000" y="288" width="300" height="66" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="1018" y="314" font-size="15" font-weight="bold" fill="#14532d">GCS bucket</text>
    <text x="1018" y="336" font-size="13" fill="#334155">raw audio captures</text>
  </g>
  <g>
    <rect x="1000" y="374" width="300" height="66" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="1018" y="400" font-size="15" font-weight="bold" fill="#581c87">Gemini API</text>
    <text x="1018" y="422" font-size="13" fill="#334155">hears audio natively — no separate STT</text>
  </g>

  <!-- Cloud Run <-> right column arrows -->
  <path d="M812,220 L992,204" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="840" y="196" font-size="12" fill="#64748b">read/write state</text>
  <path d="M812,321 L992,321" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="840" y="313" font-size="12" fill="#64748b">audio upload</text>
  <path d="M812,360 L992,404" stroke="#7e22ce" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="840" y="392" font-size="12" fill="#7e22ce">model calls + tool results</text>

  <!-- ===================== Async triggers (bottom) ===================== -->
  <text x="40" y="612" font-size="14" font-weight="bold" fill="#64748b" letter-spacing="1">ASYNC TRIGGERS (OIDC-AUTHENTICATED PUSH)</text>

  <g>
    <rect x="40" y="626" width="300" height="88" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="58" y="654" font-size="15" font-weight="bold" fill="#7c2d12">Eventarc</text>
    <text x="58" y="676" font-size="13" fill="#334155">GCS object finalized →</text>
    <text x="58" y="694" font-size="13" fill="#334155">push to /internal/enrich (~10 s e2e)</text>
  </g>
  <g>
    <rect x="40" y="734" width="300" height="106" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="58" y="762" font-size="15" font-weight="bold" fill="#7c2d12">Cloud Scheduler</text>
    <text x="58" y="784" font-size="13" fill="#334155">daily_review — 09:00 PT</text>
    <text x="58" y="802" font-size="13" fill="#334155">nightly_digest — 03:00 PT</text>
    <text x="58" y="824" font-size="13" fill="#334155">→ push to /internal/routines/&lt;name&gt;</text>
  </g>

  <!-- trigger arrows into /internal -->
  <path d="M340,670 C480,670 520,590 555,552" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M340,787 C540,787 600,620 640,552" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>
  <!-- GCS event source arrow -->
  <path d="M1018,354 C1000,480 600,560 348,650" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="586" font-size="12" fill="#64748b">object-finalized event</text>

  <!-- ===================== Routine output / approvals ===================== -->
  <g>
    <rect x="560" y="626" width="380" height="214" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="578" y="654" font-size="15" font-weight="bold" fill="#312e81">Routines are agentic + auditable</text>
    <text x="578" y="682" font-size="13" fill="#334155">each run: Gemini plans with tools (list notes,</text>
    <text x="578" y="700" font-size="13" fill="#334155">list tasks, queue approvals, write note) —</text>
    <text x="578" y="718" font-size="13" fill="#334155">full trace stored and replayable in the UI</text>
    <text x="578" y="746" font-size="13" fill="#334155">output: review/digest note in the feed +</text>
    <text x="578" y="764" font-size="13" fill="#334155">queued approvals for task mutations</text>
    <text x="578" y="792" font-size="13" font-weight="bold" fill="#312e81">human in the loop: nothing mutates a task</text>
    <text x="578" y="810" font-size="13" font-weight="bold" fill="#312e81">until an approval is accepted in the SPA</text>
  </g>
  <path d="M700,626 L700,558" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M940,760 C1220,760 1400,540 1310,274" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="1180" y="700" font-size="12" fill="#2563eb">approve → task mutated</text>

  <!-- numbered flow legend -->
  <g font-size="13" fill="#334155">
    <text x="1000" y="490" font-weight="bold" fill="#64748b" font-size="14" letter-spacing="1">FLOWS</text>
    <text x="1000" y="514">1. text → sync enrichment → note + tasks</text>
    <text x="1000" y="536">2. audio → GCS → Eventarc → enrichment</text>
    <text x="1000" y="558">3. schedule → routine run → note + approvals</text>
    <text x="1000" y="580">4. approve in SPA → task mutation</text>
  </g>
</svg>
